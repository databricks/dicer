// Test data for `DicerClientFeatureRolloutRuleOverrideSuite` (Scala) and
// `dicer_client_feature_rollout_rule_override_test` (Rust). The two suites load this same textproto so
// that input cases stay in sync across languages.
//
// Next ID: 3.
message DicerClientFeatureRolloutRuleOverrideTestDataP {
  // Override protos that should pass `from_proto`. Each entry's `description` identifies the case.
  //
  // PRECONDITION: Every field below is required; the test suites panic if any is unset.
